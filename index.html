<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Blush & Curl | Hairdressing Salon</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-wrapper">
        <header class="main-header">
            <div class="logo-area">
                <i class="fas fa-cut"></i>
                <div>
                    <h1>Aliyah </h1>
                    <p>my baby salon</p>
                </div>
            </div>
            <button class="color-toggle-btn" id="colorToggleBtn">
                <i class="fas fa-palette"></i> <span id="toggleThemeText">LOML</span>
            </button>
        </header>

        <section class="hero">
            <div class="hero-content">
                <span class="hero-badge">✨ by appointment only</span>
                <h2>Your hair, your style</h2>
                <p>Personalized hair care in a cozy, private studio setting.</p>
                <div class="hero-stats">
                    <div><i class="fas fa-star"></i> 5+ years experience</div>
                    <div><i class="fas fa-smile"></i> 100% tailored service</div>
                </div>
            </div>
            <div class="hero-illustration">
                <i class="fas fa-spa"></i>
            </div>
        </section>

        <div class="booking-dashboard">
            <!-- Booking Form -->
            <div class="form-panel">
                <div class="section-title">
                    <i class="fas fa-calendar-plus"></i> 
                    <span>Book Your Hair Appointment</span>
                </div>
                <form id="hairBookingForm">
                    <div class="input-field">
                        <label><i class="fas fa-user"></i> Full Name *</label>
                        <input type="text" id="clientName" placeholder="Enter your full name" required>
                    </div>
                    <div class="input-field">
                        <label><i class="fas fa-envelope"></i> Email *</label>
                        <input type="email" id="clientEmail" placeholder="your@email.com" required>
                    </div>
                    <div class="input-field">
                        <label><i class="fas fa-phone"></i> Phone *</label>
                        <input type="tel" id="clientPhone" placeholder="(555) 123-4567" required>
                    </div>
                    <div class="row-2">
                        <!-- <div class="input-field">
                            <label><i class="fas fa-cut"></i> Hair Service</label>
                            <select id="serviceType">
                                <option value="Women's Haircut">💇‍♀️ Women's Haircut - $45</option>
                                <option value="Men's Haircut">💇‍♂️ Men's Hair - $35</option>
                                <option value="Hair Color">🎨 Hair Color - $120</option>
                                <option value="Highlights">✨ Highlights - $150</option>
                                <option value="Blowout">💨 Blowout - $40</option>
                                <option value="Keratin Treatment">✨ Keratin Treatment - $200</option>
                            </select>
                        </div> -->
                        <div class="input-field">
                            <label><i class="fas fa-clock"></i> Duration</label>
                            <select id="duration">
                                <option value="30 min">30 min - Quick Cut</option>
                                <option value="1 hour">1 hour - Standard Cut</option>
                                <option value="1.5 hours">1.5 hours - Color</option>
                                <option value="2 hours">2 hours - Color + Cut</option>
                            </select>
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="input-field">
                            <label><i class="fas fa-calendar-day"></i> Appointment Date *</label>
                            <input type="date" id="appointmentDate" required>
                        </div>
                        <div class="input-field">
                            <label><i class="fas fa-clock"></i> Time *</label>
                            <input type="time" id="appointmentTime" required>
                        </div>
                    </div>
                    <div class="row-2">
                        <div class="input-field">
                            <label><i class="fas fa-bell"></i> Reminder Before</label>
                            <select id="reminderHours">
                                <option value="1">1 hour before</option>
                                <option value="3">3 hours before</option>
                                <option value="6">6 hours before</option>
                                <option value="24">1 day before</option>
                            </select>
                        </div>
                        <div class="input-field">
                            <label><i class="fas fa-user-tie"></i> Preferred Style</label>
                            <select id="stylist">
                                <option value="Any">Braids</option>
                                <option value="Sarah">ghana weaving</option>
                                <option value="Jessica">Notless braids</option>
                                
                            </select>
                        </div>
                    </div>
                    <div class="input-field">
                        <label><i class="fas fa-comment"></i> Special Requests</label>
                        <textarea id="notes" rows="2" placeholder="Any allergies, inspiration photos, or special requests..."></textarea>
                    </div>
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-calendar-check"></i> Book Appointment
                    </button>
                </form>
            </div>

            <!-- Appointments List -->
            <div class="booking-sidebar">
                <div class="upcoming-header">
                    <i class="fas fa-list-ul"></i> 
                    <span>My Appointments</span>
                    <button id="refreshBtn" class="icon-btn"><i class="fas fa-sync-alt"></i></button>
                </div>
                <div id="bookingsList" class="bookings-list">
                    <!-- Appointments will appear here -->
                </div>
                <div class="info-banner">
                    <i class="fas fa-bell"></i> Reminders sent automatically
                </div>
            </div>
        </div>

        <!-- Notification Panel -->
        <div id="notifPanel" class="notification-panel">
            <div class="notif-header">
                <span><i class="fas fa-bell"></i> Notifications</span>
                <button id="closeNotifBtn" class="close-notif">✕</button>
            </div>
            <div id="notifList" class="notif-list"></div>
        </div>
        
        <button id="openNotifBtn" class="notif-float-btn">
            <i class="fas fa-bell"></i>
            <span id="notifCount">0</span>
        </button>
    </div>

    <script src="index.js"></script>
</body>
</html>
